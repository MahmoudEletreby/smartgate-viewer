<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartGate inspection record</title>
<style>
:root{
  --ground:#F4F3F1; --panel:#FBFAF9; --rule:#D8D5D1; --rule2:#E8E6E2;
  --ink:#1A1A19; --ink2:#6B6864; --ink3:#9A9692;
  --valid:#009E73; --partial:#E69F00; --invalid:#8A8683; --na:#C4C1BD;
  --scratch:#0072B2; --dent:#CC79A7; --excl:#D55E00;
  --font:"IBM Plex Sans","Source Sans 3","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-variant-numeric:tabular-nums}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
b,strong{font-weight:600}
small{font-size:11px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.u{font-size:11px;color:var(--ink2);margin-left:2px}
.lab{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)}
.tiny{font-size:11px}
hr{border:0;border-top:1px solid var(--rule);margin:8px 0}

#app{display:grid;height:100vh;width:100vw;grid-template-rows:44px 48px minmax(0,1fr) 150px;grid-template-columns:280px minmax(0,1fr) 340px;background:var(--rule)}
#app>*{background:var(--panel);min-width:0;min-height:0}
#subjectbar{grid-column:1/4;display:flex;align-items:stretch;border-bottom:1px solid var(--rule);gap:1px;background:var(--rule)}
#header{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:1px solid var(--rule)}
#left{grid-row:3;grid-column:1;display:flex;flex-direction:column;overflow:hidden}
#stage{grid-row:3;grid-column:2;display:flex;flex-direction:column;overflow:hidden}
#right{grid-row:3;grid-column:3;overflow:auto;padding:10px 12px 20px}
#strip{grid-column:1/4;display:flex;align-items:stretch;border-top:1px solid var(--rule);overflow:hidden}

/* subject bar */
.subj{flex:1 1 0;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);text-align:left;min-height:44px}
.subj[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.subj[aria-pressed="true"] small{color:#D8D5D1}
.subj .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.subj .t{display:flex;flex-direction:column;line-height:1.15}
.subj .t b{font-size:13px}
.subj .t small{font-size:11px}
#subjectbar .aux{flex:0 0 auto;display:flex;gap:1px}
#subjectbar .aux button{background:var(--panel);padding:0 14px;min-height:44px;font-size:12px;color:var(--ink2)}
#subjectbar .aux button:hover{color:var(--ink)}

/* header */
#header h1{font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
#header .headline{flex:1 1 80px;min-width:0;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#thresh{flex:0 0 auto}
.seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{padding:0 12px;min-height:34px;font-size:12px;border-right:1px solid var(--rule);white-space:nowrap;flex:0 0 auto}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
#thresh{display:flex;align-items:center;gap:10px;white-space:nowrap}
#thresh input[type=range]{width:150px;accent-color:var(--ink)}
#thresh .k{display:inline-flex;flex-direction:column;line-height:1.1;align-items:flex-end;min-width:44px}
#thresh .k b{font-size:15px;font-weight:600}
#thresh .k small{font-size:10px}
#thresh .sep{width:1px;height:26px;background:var(--rule)}

/* left rail */
#left .pane{padding:10px 12px;border-bottom:1px solid var(--rule)}
#left table.t{font-size:11px}
#left table.t td,#left table.t th{padding:3px 3px}
#left table.t .u{display:none}
#left .list{flex:1 1 auto;overflow:auto}
#schematic{width:100%;max-width:264px;height:auto;display:block;margin:0 auto}
#schematic .body{fill:var(--ground);stroke:var(--ink3);stroke-width:1.4}
#schematic .lead{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}
#schematic .part{fill:var(--panel);stroke:var(--ink3);stroke-width:1;cursor:pointer;transition:stroke-width .08s}
#schematic .part.glass{stroke-dasharray:none;opacity:.9}
#schematic .part.lamp{stroke-width:.8}
#schematic .part:hover{stroke:var(--ink);stroke-width:1.6}
#schematic .part.sel{stroke:var(--ink);stroke-width:2.2}
#schematic .part.inert{fill:none;stroke:var(--rule);stroke-dasharray:2 2;cursor:default}
#schematic .part.inert:hover{stroke:var(--rule);stroke-width:1}
#schematic text{font-size:9px;fill:var(--ink2);pointer-events:none;font-family:var(--font)}
#schematic .axis{font-size:9px;fill:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.prow{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;width:100%;padding:0 12px;min-height:34px;text-align:left;border-bottom:1px solid var(--rule2)}
.prow[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.prow[aria-pressed="true"] small{color:#D8D5D1}
.prow .dot{width:9px;height:9px;border-radius:50%}
.prow .n{font-size:12px}
.prow .r{font-size:11px;color:var(--ink2);text-align:right}
.prow[aria-pressed="true"] .r{color:#D8D5D1}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--ink2);padding:6px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* stage */
#tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);min-height:40px}
#tabs .grp{display:flex;align-items:stretch}
#tabs .grp+.grp{border-left:1px solid var(--rule)}
#tabs button.tab{padding:0 12px;min-height:40px;font-size:12px;color:var(--ink2);border-bottom:2px solid transparent}
#tabs button.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
#tabs button.tab[disabled]{color:var(--na);cursor:default}
#tabs .spacer{flex:1}
#tabs .seg{margin:6px 8px 6px 0}
#tabs .seg button{min-height:26px;padding:0 9px;font-size:11px}
#tabnote{display:none;padding:6px 12px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--rule);background:var(--ground)}
#tabnote.on{display:block}
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#101010;touch-action:none;cursor:grab}
#viewport.dragging{cursor:grabbing}
#viewport img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform;max-width:none}
#viewport img.pix{image-rendering:pixelated;image-rendering:crisp-edges}
#viewport .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9A9692;font-size:12px;text-align:center;padding:20px}
#zoomctl{position:absolute;right:8px;top:8px;display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
#zoomctl button,#zoomctl span{background:var(--panel);min-height:30px;min-width:30px;padding:0 8px;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
#zoomctl span{color:var(--ink2);min-width:88px}
/* Fixed height. If this reflows between layers the viewport changes size, and
   a shared zoom viewport then appears to shift when switching layer. */
#caption{display:flex;flex-wrap:nowrap;gap:3px 14px;align-items:center;padding:6px 12px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink2);height:34px;overflow:hidden}
#caption>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#caption>div:nth-child(2){flex:1 1 auto;min-width:0}
#caption>div:nth-child(1),#caption>div:nth-child(3){flex:0 0 auto}
#caption .id{font-family:var(--mono);color:var(--ink);font-size:11px;white-space:nowrap}
#caption .excl{color:var(--excl)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 7px;border:1px solid var(--rule);border-radius:2px;font-size:11px;color:var(--ink);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.big{font-size:12px;padding:3px 9px}

/* right rail */
#right h2{font-size:17px;font-weight:600;line-height:1.2}
#right h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
#right h3:first-of-type{margin-top:10px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:12px}
.kv div:nth-child(odd){color:var(--ink2)}
.kv div:nth-child(even){text-align:right;white-space:normal;overflow-wrap:anywhere;max-width:200px;justify-self:end}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font-weight:500;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--rule);font-size:11px;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:3px 4px;border-bottom:1px solid var(--rule2);text-align:right;white-space:nowrap}
table.t tr.rej td{color:var(--ink2)}
table.t tr.rej td:first-child{color:var(--ink)}
.reason{font-size:12px;line-height:1.4;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--ground);margin:6px 0}
.reason.q{font-style:normal}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:11px}
.bars .bar{height:8px;background:var(--rule2);position:relative}
.bars .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.bars .bar.g6 i{background:var(--valid)}
.note{font-size:11px;color:var(--ink2);line-height:1.4;margin-top:6px}
.evstrip{display:flex;align-items:flex-end;gap:2px;height:44px;padding:4px 0;border-bottom:1px solid var(--rule);overflow-x:auto}
.evstrip button{flex:0 0 auto;width:8px;min-width:8px;border-radius:0;height:100%;position:relative;padding:0;min-height:0}
.evstrip button i{position:absolute;left:1px;right:1px;bottom:0;display:block}
.evstrip button.cur i{outline:1px solid var(--ink)}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-size:12px}
.cmp div{white-space:nowrap}
.cmp .h{color:var(--ink2);font-size:11px;text-align:right}
.cmp .h:first-child{text-align:left}
.cmp .v{text-align:right}
.figs img{width:100%;display:block;border:1px solid var(--rule);margin-top:6px}
.runs td{white-space:normal}

/* strip */
#dial{flex:0 0 auto;width:214px;touch-action:none;border-right:1px solid var(--rule);display:flex;align-items:center;justify-content:center;padding:4px}
#dial svg{width:206px;height:152px;display:block}
#dial .tick{stroke:var(--ink3);stroke-width:1}
#dial .ring{fill:none;stroke:var(--rule);stroke-width:1}
#dial .grab{fill:none;stroke:transparent;stroke-width:40;cursor:grab;pointer-events:stroke}
#dial .handle{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none}
#dial .handle.live{stroke-width:2.6}
body.dialdrag{cursor:grabbing;user-select:none}
body.dialdrag #dial .grab{cursor:grabbing}
#dial .ang{cursor:pointer}
#dial .ang circle{fill:var(--panel);stroke:var(--ink3);stroke-width:1}
#dial .ang.sel circle{fill:var(--ink);stroke:var(--ink)}
#dial .ang.sel text{fill:var(--ground)}
#dial .ang.excl circle{stroke:var(--excl);stroke-dasharray:2 2}
#dial .ang.excl line{stroke:var(--excl);stroke-width:1.5}
#dial text{font-size:8px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none;font-family:var(--font)}
#dial .cam{cursor:pointer}
#dial .cam rect{fill:var(--panel);stroke:var(--rule)}
#dial .cam.sel rect{fill:var(--ink);stroke:var(--ink)}
#dial .cam.sel text{fill:var(--ground)}
#dial .lbl{font-size:8px;fill:var(--ink2)}
#thumbs{flex:1 1 auto;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;gap:1px;background:var(--rule);padding:0}
.grp-lab{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:6px 3px;background:var(--panel);display:flex;align-items:center}
.th{flex:0 0 auto;width:118px;background:var(--panel);display:flex;flex-direction:column;align-items:stretch;padding:4px 4px 3px;text-align:left;position:relative}
.th[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.th[aria-pressed="true"] small{color:#D8D5D1}
.th img{width:110px;height:auto;max-height:96px;object-fit:contain;display:block;background:#101010;border:1px solid var(--rule)}
.th .cap{display:flex;justify-content:space-between;font-size:10px;line-height:1.2;margin-top:3px;font-family:var(--mono)}
.th.excl img{opacity:.55}
.th.excl::after{content:"";position:absolute;left:8px;right:8px;top:52px;height:0;border-top:2px solid var(--excl);transform:rotate(-14deg)}
.th .x{position:absolute;top:6px;right:7px;font-size:9px;letter-spacing:.05em;color:var(--excl);text-transform:uppercase;background:var(--panel);padding:0 3px}
.th .st{position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%}
#strip .none{padding:12px;color:var(--ink2);font-size:12px}

/* drawer */
#drawer{position:fixed;inset:0;background:rgba(26,26,25,.45);display:none;z-index:10}
#drawer.on{display:block}
#drawer .box{position:absolute;right:0;top:0;bottom:0;width:min(640px,92vw);background:var(--panel);border-left:1px solid var(--rule);overflow:auto;padding:16px 18px 30px}
#drawer h2{font-size:16px;font-weight:600}
#drawer .status{font-size:12px;color:var(--ink2);border:1px solid var(--rule);padding:6px 10px;border-radius:2px;margin:10px 0 14px;background:var(--ground)}
#drawer p{font-size:12.5px;line-height:1.5;margin:8px 0}
#drawer h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
#drawer .close{position:absolute;top:8px;right:10px;min-height:36px;min-width:36px;font-size:18px;color:var(--ink2)}
#drawer img{width:100%;display:block;border:1px solid var(--rule);margin:8px 0}
.st-valid{background:var(--valid)}.st-partial{background:var(--partial)}.st-invalid{background:var(--invalid)}.st-not_attempted{background:var(--na)}.st-abstains{background:var(--invalid)}
.cl-scratch{background:var(--scratch)}.cl-dent{background:var(--dent)}
.txt-valid{color:var(--valid)}.txt-partial{color:var(--partial)}.txt-invalid{color:var(--invalid)}
#toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;font-size:12px;border-radius:2px;display:none;z-index:20;max-width:80vw}
#toast.on{display:block}
@media (max-width:1100px){#app{grid-template-columns:240px minmax(0,1fr) 300px}}
</style>
</head>
<body>
<script type="application/json" id="data">/*__DATA__*/</script>

<div id="app">
  <div id="subjectbar"></div>
  <div id="header"></div>
  <div id="left"></div>
  <div id="stage">
    <div id="tabs"></div>
    <div id="tabnote"></div>
    <div id="viewport">
      <div id="zoomctl">
        <button id="zfit" title="Fit to frame">Fit</button>
        <button id="z11" title="One image pixel per screen pixel">1:1</button>
        <button id="zminus">&minus;</button>
        <button id="zplus">+</button>
        <span id="zread">fit</span>
      </div>
    </div>
    <div id="caption"></div>
  </div>
  <div id="right"></div>
  <div id="strip">
    <div id="dial"></div>
    <div id="thumbs"></div>
  </div>
</div>

<div id="drawer"><div class="box" id="drawerbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ data */
const D = JSON.parse(document.getElementById('data').textContent);
const ROOTP = 'viewer_data/';
const img = p => p ? ROOTP + p : null;

const viewsById = Object.fromEntries(D.views.map(v => [v.id, v]));
const seqById = Object.fromEntries(D.bmw_sequence.map(v => [v.id, v]));
const bmwCloseById = Object.fromEntries(D.bmw_views.map(v => [v.id, v]));
const psKey = c => `${c.capture}::${c.camera}`;
const psByKey = Object.fromEntries(D.ps_captures.map(c => [psKey(c), c]));
const psBySubject = {};
for (const c of D.ps_captures) (psBySubject[c.subject] ||= []).push(c);
const partsByKey = Object.fromEntries(D.parts.map(p => [`${p.vehicle}::${p.part}`, p]));
const subjectsById = Object.fromEntries(D.subjects.map(s => [s.id, s]));
const captureSupport = D.measurements.capture_support || {};

const DECISION = {
  no_rgb_damage: 'No damage detected',
  rgb_damage_single_view_only: 'Detected in one view only',
  rgb_damage_multiview_confirmed_no_geometry: 'Confirmed across views, no geometry',
  rgb_damage_geometry_partially_supported: 'Confirmed, geometry partially supports'
};
const STATE_LABEL = { valid: 'Valid', partial: 'Partial', invalid: 'Invalid', not_attempted: 'Not attempted', abstains: 'Abstains' };
const CAM_LABEL = { cam0: 'cam0', cam1: 'cam1', cam2: 'cam2', cam3: 'cam3' };
const EXCL_REASON = 'Excluded from aggregation. The COCO vehicle crop found no vehicle in this frame, so segmentation ran on the full chamber frame and no detection is read from it.';
const PS_POSE_NOTE = 'Photometric stereo bursts sit at specific poses only. RGB is captured at every indexed angle; a twelve-light burst is spent on selected views. Select a panel burst in the strip to see its geometry.';
const PS_NOT_RR = 'No photometric stereo burst covers this part.';
const BLANK_REASON = 'Empty after refinement. The quality gate removed every pixel of this region, so there is no image to show. That is the result rather than a fault: switch to the unfiltered variant to see what the solver produced before the gate was applied.';
const withheldList = c => (c && c.withheld_maps) ? Object.entries(c.withheld_maps).map(([k, v]) => `${LAYER_LABEL[k].toLowerCase()} (${v.join(' and ')})`).join(', ') : '';
const FRAME_LAYERS = ['rgb', 'damage', 'parts'];
const PS_LAYERS = ['photo', 'normal', 'support', 'usable', 'depth', 'elevation'];
const LAYER_LABEL = { rgb: 'RGB', damage: 'Damage', parts: 'Parts', photo: 'Photo', normal: 'Normals', support: 'Support', usable: 'Usable lights', depth: 'Depth', elevation: 'Elevation' };
const LAYER_HINT = { photo: 'prepared photograph, cropped to the solved region', normal: 'surface normal, false colour', support: 'illumination support, 0 to 1', usable: 'usable lights per pixel, 0 to 12', depth: 'integrated relative depth, robust range', elevation: 'normal elevation, 0 to 90 degrees' };
const PART_LABEL = s => s.replace(/_/g, ' ');

/* ----------------------------------------------------------------- state */
const S = {
  // Land on the white BMW. It is the subject where the geometry gate returns
  // valid and the dents are visible in the normal map, so a reader who opens
  // the page and looks at one screen sees the measurement working. The Range
  // Rover is the harder surface and reads as a failure without the surrounding
  // explanation, which is in its own subject panel.
  subject: 'bmw_white',
  vehicle: 'damaged',
  part: null,
  view: null,          // id in views / bmw_sequence / bmw_views / ps key
  layer: 'rgb',
  variant: 'filtered',
  thresholdIdx: 0,
  compare: false,
  vp: { frame: { s: 1, cx: .5, cy: .5 }, ps: { s: 1, cx: .5, cy: .5 } },
  showTabNote: null
};

/* --------------------------------------------------------------- helpers */
const $ = sel => document.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'style') n.style.cssText = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const fmt = (x, d = 2) => (x == null || Number.isNaN(+x)) ? 'n/a' : (+x).toFixed(d);
const pct = (x, d = 1) => x == null ? 'n/a' : (100 * x).toFixed(d) + '%';
const num = x => (x == null || x === '' ) ? null : (typeof x === 'string' ? (x === 'True' ? true : x === 'False' ? false : (isNaN(+x) ? x : +x)) : x);
const toast = (m, ms = 2600) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); };
const dot = (cls, extra = '') => el('i', { class: `dot ${cls} ${extra}`.trim(), style: 'display:inline-block;width:9px;height:9px;border-radius:50%' });
const stateChip = (state, big) => el('span', { class: `chip${big ? ' big' : ''}` }, el('i', { class: `st-${state}` }), STATE_LABEL[state] || state);

/* ------------------------------------------------------ view resolution */
function subjectViews() {
  if (S.subject === 'range_rover') return D.views.filter(v => v.vehicle === S.vehicle);
  if (S.subject === 'bmw_white') return D.bmw_sequence;
  return [];
}
function currentPart() { return S.part ? partsByKey[`${S.vehicle}::${S.part}`] : null; }

const VP = {

  pointers: new Map(), last: null, pinch: null,
  fitScale() { const r = this.el.getBoundingClientRect(); if (!this.nat[0]) return 1; return Math.min(r.width / this.nat[0], r.height / this.nat[1]); },
  state() { return S.vp[this.family]; },
  apply() {
    if (!this.imgEl || !this.nat[0]) return;
    const r = this.el.getBoundingClientRect(); const st = this.state();
    const k = this.fitScale() * st.s;
    const w = this.nat[0] * k, h = this.nat[1] * k;
    const tx = r.width / 2 - st.cx * w, ty = r.height / 2 - st.cy * h;
    this.imgEl.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
    this.imgEl.classList.toggle('pix', k > 2);
    const pxpp = k; // screen px per image px
    $('#zread').textContent = `${st.s.toFixed(2)}× of fit · ${pxpp.toFixed(2)} px/px${pxpp > 1.001 ? ' · past 1:1' : ''}`;
  },
  setImage(src, family) {
    this.family = family;
    if (!this.imgEl) { this.imgEl = el('img', { alt: '', draggable: 'false' }); this.el.append(this.imgEl); }
    const self = this;
    this.imgEl.onload = () => { self.nat = [self.imgEl.naturalWidth, self.imgEl.naturalHeight]; self.apply(); };
    if (this.imgEl.src !== new URL(src, location.href).href) this.imgEl.src = src; else this.apply();
    this.imgEl.style.display = '';
  },
  clear() { if (this.imgEl) this.imgEl.style.display = 'none'; $('#zread').textContent = 'no image'; },
  zoomAt(factor, px, py) {
    const st = this.state(); const r = this.el.getBoundingClientRect();
    const k0 = this.fitScale() * st.s;
    const s1 = Math.max(1, Math.min(8, st.s * factor));
    const k1 = this.fitScale() * s1;
    // keep the image point under (px,py) fixed
    const w0 = this.nat[0] * k0, h0 = this.nat[1] * k0;
    const ix = (px - (r.width / 2 - st.cx * w0)) / w0, iy = (py - (r.height / 2 - st.cy * h0)) / h0;
    const w1 = this.nat[0] * k1, h1 = this.nat[1] * k1;

  },
  clampCentre() { const st = this.state(); st.cx = Math.max(0, Math.min(1, st.cx)); st.cy = Math.max(0, Math.min(1, st.cy)); },
  panBy(dx, dy) { const st = this.state(); const k = this.fitScale() * st.s; st.cx -= dx / (this.nat[0] * k); st.cy -= dy / (this.nat[1] * k); this.clampCentre(); this.apply(); },
  fit() { const st = this.state(); st.s = 1; st.cx = .5; st.cy = .5; this.apply(); },
  oneToOne() { const st = this.state(); st.s = Math.max(1, Math.min(8, 1 / this.fitScale())); this.apply(); },
  init() {
    this.el = $('#viewport');
    const v = this.el;
    v.addEventListener('pointerdown', e => {
      if (e.target.closest('#zoomctl')) return;
      v.setPointerCapture(e.pointerId); this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.pointers.size === 1) { this.last = [e.clientX, e.clientY]; v.classList.add('dragging'); }
      if (this.pointers.size === 2) { const [a, b] = [...this.pointers.values()]; this.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
    });
    v.addEventListener('pointermove', e => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (this.pinch) { const r = v.getBoundingClientRect(); this.zoomAt(d / this.pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); }
        this.pinch = d;
      } else if (this.pointers.size === 1 && this.last) {
        this.panBy(e.clientX - this.last[0], e.clientY - this.last[1]); this.last = [e.clientX, e.clientY];
      }
    });
    const up = e => { this.pointers.delete(e.pointerId); if (this.pointers.size < 2) this.pinch = null; if (this.pointers.size === 0) { this.last = null; v.classList.remove('dragging'); } };

    v.addEventListener('wheel', e => { e.preventDefault(); const r = v.getBoundingClientRect(); this.zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    let lastTap = 0;
    v.addEventListener('pointerup', e => {
      if (e.target.closest('#zoomctl')) return;
      const t = performance.now();
      if (t - lastTap < 320) { const r = v.getBoundingClientRect(); const st = this.state(); if (st.s > 1.05) this.fit(); else this.zoomAt(4, e.clientX - r.left, e.clientY - r.top); lastTap = 0; }

/* ---- strip */
function renderStrip() {

    for (const v of views) th.append(thumb(v.id, img(v.img.thumb), v.camera, v.angle + '°', !v.crop_ok, null, cur === v.id));
  } else if (S.subject === 'bmw_white') {

  } else {

function thumb(id, src, cam, label, excluded, state, pressed) {

/* Drag to rotate the turntable. The dial svg is rebuilt on every view change,

let dragging = false;
function dialAngleAt(clientX, clientY) {
  const svg = $('#dial svg'); if (!svg) return null;
  const ctm = svg.getScreenCTM(); if (!ctm) return null;

  const q = pt.matrixTransform(ctm.inverse());
  const cx = +svg.dataset.cx, cy = +svg.dataset.cy, R = +svg.dataset.r;

}
function snapToAngle(deg) {

  for (const a of A) {
    const d = Math.min(Math.abs(a - deg), 360 - Math.abs(a - deg));
    if (d < bestD) { bestD = d; best = a; }

}
function dialSeekTo(deg) {
  const cur = viewsById[S.view] || seqById[S.view];
  const cam = cur ? cur.camera : (S._cam || 'cam2');
  const a = snapToAngle(deg);

  if (v && v.id !== S.view) selectView(v.id);
}
function bindDial() {

  dial.dataset.bound = '1';

  dial.addEventListener('pointerdown', e => {
    const g = dialAngleAt(e.clientX, e.clientY); if (!g) return;
    // only near the ring, so the camera buttons in the corner stay clickable
    if (g.radius < g.R - 24 || g.radius > g.R + 20) return;
    start = { x: e.clientX, y: e.clientY }; moved = false;
  });
  window.addEventListener('pointermove', e => {
    if (!start) return;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
    if (!moved) { moved = true; dragging = true; document.body.classList.add('dialdrag'); }
    const g = dialAngleAt(e.clientX, e.clientY); if (!g) return;
    e.preventDefault();
    dialSeekTo(g.deg);
  }, { passive: false });
  const end = () => {
    if (moved) { dragging = false; document.body.classList.remove('dialdrag'); renderStrip(); }
    start = null; moved = false;
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

function renderDial(dial) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '0 0 210 156');
  const cx = 70, cy = 78, R = 60;

  const grab = document.createElementNS(svgNS, 'circle'); grab.setAttribute('cx', cx); grab.setAttribute('cy', cy); grab.setAttribute('r', R); grab.setAttribute('class', 'grab'); svg.append(grab);
  svg.dataset.cx = cx; svg.dataset.cy = cy; svg.dataset.r = R;
  const views = subjectViews();
  const curView = viewsById[S.view] || seqById[S.view];
  const closeup = bmwCloseById[S.view];
  const curCam = curView ? curView.camera : (closeup ? closeup.camera : (S._cam || 'cam2'));
  const curAngle = curView ? curView.angle : null;

  const lbl2 = document.createElementNS(svgNS, 'text'); lbl2.setAttribute('x', cx); lbl2.setAttribute('y', cy + 6); lbl2.setAttribute('class', 'lbl'); lbl2.textContent = curAngle != null ? `${curAngle}° · ${curCam}` : 'no view'; svg.append(lbl2);
  for (const a of D.manifest.angles) {

    const tk = document.createElementNS(svgNS, 'line'); tk.setAttribute('x1', cx + (R - 8) * Math.cos(t)); tk.setAttribute('y1', cy + (R - 8) * Math.sin(t)); tk.setAttribute('x2', cx + R * Math.cos(t)); tk.setAttribute('y2', cy + R * Math.sin(t)); tk.setAttribute('class', 'tick'); svg.append(tk);

    if (v && !v.crop_ok) { const ln = document.createElementNS(svgNS, 'line'); ln.setAttribute('x1', x - 6.5); ln.setAttribute('y1', y + 6.5); ln.setAttribute('x2', x + 6.5); ln.setAttribute('y2', y - 6.5); g.append(ln); }

    const t = document.createElementNS(svgNS, 'text'); t.setAttribute('x', x + 11); t.setAttribute('y', y + 16); t.textContent = cam.replace('cam', ''); g.append(t);
    const pick = () => { S._cam = cam; const a = curAngle != null ? curAngle : 0; const v = views.find(w => w.camera === cam && w.angle === a) || views.find(w => w.camera === cam); if (v) selectView(v.id); else renderStrip(); };

/* --------------------------------------------------------------- actions */
function subjectDefaults(id) {
  S.subject = id; S.part = null; S.compare = false; S.showTabNote = null;
  S.vp = { frame: { s: 1, cx: .5, cy: .5 }, ps: { s: 1, cx: .5, cy: .5 } };
  if (id === 'range_rover') { S.view = `${S.vehicle}_cam2_r000`; S.layer = 'rgb'; }
  else if (id === 'bmw_white') { S.view = D.bmw_views[0].id; S.layer = 'normal'; }
  else { const c = (psBySubject[id] || [])[0]; S.view = c ? psKey(c) : null; S.layer = 'normal'; }
}
function selectSubject(id) {
  if (S.subject === id) return;
  subjectDefaults(id);
  render();
}
/* Deep link: #subject=bmw_white&view=...&layer=normal&part=hood&vehicle=clean&compare=1&threshold=6 */
function applyHash() {
  const h = location.hash.replace(/^#/, ''); if (!h) return;
  const q = Object.fromEntries(h.split('&').filter(Boolean).map(kv => kv.split('=').map(s => decodeURIComponent(s))));
  if (q.vehicle && D.manifest.vehicles.includes(q.vehicle)) S.vehicle = q.vehicle;
  if (q.subject && subjectsById[q.subject]) subjectDefaults(q.subject);
  if (q.view) S.view = q.view;
  if (q.part) {
    S.part = q.part;
    // A part named without an explicit view opens on that part's own target,
    // the same view clicking it in the plan view would open.
    if (!q.view) {
      const rec = partsByKey[`${S.vehicle}::${q.part}`];
      const t = rec && ((rec.best_seen_view && viewsById[rec.best_seen_view]) ? rec.best_seen_view
                      : (rec.representative_view && viewsById[rec.representative_view]) ? rec.representative_view : null);
      if (t) S.view = t;
    }
  }
  if (q.layer && LAYER_LABEL[q.layer]) S.layer = q.layer;
  if (q.variant === 'filtered' || q.variant === 'unfiltered') S.variant = q.variant;
  if (q.compare) S.compare = q.compare === '1';
  if (q.threshold != null && D.sensitivity[+q.threshold]) S.thresholdIdx = +q.threshold;
  if (q.z) { const v = S.vp[PS_LAYERS.includes(S.layer) ? 'ps' : 'frame']; v.s = Math.max(1, Math.min(8, +q.z || 1)); if (q.cx) v.cx = +q.cx; if (q.cy) v.cy = +q.cy; }
}
function setVehicle(v) {
  if (S.vehicle === v) return;
  const cur = viewsById[S.view];
  S.vehicle = v;
  if (cur) { const id = `${v}_${cur.camera}_r${String(cur.angle).padStart(3, '0')}`; S.view = viewsById[id] ? id : `${v}_cam2_r000`; }
  else S.view = `${v}_cam2_r000`;

}
function selectPart(part) {
  const p = partsByKey[`${S.vehicle}::${part}`]; if (!p) return;
  S.part = part;
  // Open the view where the part is largest among views whose segmentation has
  // not collapsed, rather than the quality-score representative view. The
  // representative view stays in the record; it is a different question.
  const target = (p.best_seen_view && viewsById[p.best_seen_view]) ? p.best_seen_view
               : (p.representative_view && viewsById[p.representative_view]) ? p.representative_view

function selectView(id) {
  S.view = id; S.showTabNote = null;

document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'Escape') { closeDrawer(); return; }
  // Up and down rotate the turntable one indexed step, holding the camera, and
  // wrap from the last angle back to the first.
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const cur = viewsById[S.view] || seqById[S.view];
    if (!cur) return;
    const A = D.manifest.angles, n = A.length;
    const i = A.indexOf(cur.angle); if (i < 0) return;
    const views = subjectViews();
    for (let k = 1; k <= n; k++) {
      const a = A[(i + (e.key === 'ArrowUp' ? -k : k) % n + n * 2) % n];
      const v = views.find(w => w.camera === cur.camera && w.angle === a);

    }
    return;
  }

  const j = Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)));

});

/* --------------------------------------------------------------- drawer */

  box.append(el('button', { class: 'close', onclick: closeDrawer, 'aria-label': 'Close' }, '×'));
  box.append(el('h2', {}, 'Geometry-first damage proposals'));

  box.append(el('h3', {}, 'Detection is a slope limit'));
  const t = el('table', { class: 't' }); t.append(el('tr', {}, el('th', {}, 'Feature'), el('th', {}, 'Rim slope'), el('th', {}, 'Nominal depth'), el('th', {}, 'Detected')));
  for (const r of g.slope_not_depth) t.append(el('tr', {}, el('td', {}, r.feature), el('td', {}, r.rim_slope_deg + '°'), el('td', {}, fmt(r.nominal_depth_mm, 2), el('span', { class: 'u' }, 'mm')), el('td', {}, r.detected)));

/* --------------------------------------------------------------- export */
function exportName(kind) {
  const r = resolveStage(); const id = (r.caption && r.caption.id) || 'none';
  return `smartgate_${S.subject}_${S.part || 'nopart'}_${id}_${kind}.png`.replace(/[^\w.\-]+/g, '_');
}
function deliver(canvas, name) {
  try {
    canvas.toBlob(b => {
      if (!b) { toast('Export failed: the browser blocked reading this canvas.'); return; }
      const url = URL.createObjectURL(b);
      const a = el('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
      const w = window.open(url, '_blank'); if (!w) toast('Saved as ' + name + '. If no download appeared, allow pop-ups to open it in a tab.');
      else toast('Opened in a new tab and offered as ' + name);
    }, 'image/png');
  } catch (e) { toast('Export failed: ' + e.message + '. On file:// some browsers refuse to read images back from a canvas; open the image directly instead.'); }
}
function exportStage() {
  const r = resolveStage(); const src = layerSrc(r);
  if (!src) { toast('Nothing on the stage to export.'); return; }
  const im = new Image(); im.onload = () => {
    const scale = 2; const capH = 34;
    const cv = el('canvas', { width: im.naturalWidth * scale, height: im.naturalHeight * scale + capH * scale });
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#FBFAF9'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(im, 0, 0, cv.width, im.naturalHeight * scale);
    ctx.fillStyle = '#1A1A19'; ctx.font = `${12 * scale}px ${getComputedStyle(document.body).fontFamily}`;
    const txt = `${(r.caption && r.caption.id) || ''} · ${LAYER_LABEL[S.layer]}${PS_LAYERS.includes(S.layer) ? ' · ' + S.variant + (r.ps ? ' · ' + STATE_LABEL[r.ps.state] : '') : ''}${r.caption && r.caption.camera ? ' · ' + r.caption.camera : ''}${r.caption && r.caption.angle != null ? ' · ' + r.caption.angle + '°' : ''}`;
    ctx.fillText(txt, 10 * scale, im.naturalHeight * scale + 22 * scale);
    deliver(cv, exportName('stage'));
  };
  im.onerror = () => toast('Could not load the image for export.');
  im.src = src;
}
function exportRecord() {
  const R = $('#right'); const w = R.clientWidth, h = R.scrollHeight; const scale = 2;
  const css = [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join('\n'); } catch (e) { return ''; } }).join('\n');
  const clone = R.cloneNode(true); clone.querySelectorAll('img').forEach(i => i.remove());
  clone.style.cssText = `width:${w}px;height:auto;overflow:visible;background:#FBFAF9;padding:10px 12px 20px;box-sizing:border-box;font-family:${getComputedStyle(document.body).fontFamily}`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><style>${css.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</style><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" id="right">${new XMLSerializer().serializeToString(clone).replace(/^<div[^>]*>/, '').replace(/<\/div>$/, '')}</div></foreignObject></svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }); const url = URL.createObjectURL(blob);
  const im = new Image(); im.onload = () => {
    const cv = el('canvas', { width: w * scale, height: h * scale }); const ctx = cv.getContext('2d');
    ctx.fillStyle = '#FBFAF9'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.scale(scale, scale); ctx.drawImage(im, 0, 0); URL.revokeObjectURL(url);
    deliver(cv, exportName('record'));
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('Record export failed in this browser. Use the stage export, or print the page to PDF.'); };
  im.src = url;
}
